version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - Daniel-Pino-2000
    commit-message:
      prefix: build
    ignore:
      # Major toolchain bumps (AGP, Gradle, Kotlin, Firebase) are coordinated
      # manually. See the toolchain upgrade issue.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # AndroidX minor releases often require a newer AGP; upgrade them together
      # with the toolchain rather than one at a time.
      - dependency-name: "androidx.*"
        update-types:
          - "version-update:semver-minor"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      firebase:
        patterns:
          - "com.google.firebase*"
          - "com.google.android.gms*"
      kotlin-and-build:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.android.tools.build*"
          - "com.google.gms.google-services*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - Daniel-Pino-2000
    commit-message:
      prefix: ci
