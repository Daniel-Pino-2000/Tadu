name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide placeholder Firebase config
        run: cp app/google-services.json.example app/google-services.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
